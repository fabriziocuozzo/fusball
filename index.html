<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fusball v2.0</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#185FA5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fusball">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
ul{list-style:none;padding:0}
html,body{height:100%}
#stage{height:100vh;height:100dvh}
/* ===== TOKEN (libreria L4, sezione A) ===== */
:root{
 --h:221;--s:80%;--l:46%;
 --ac:hsl(var(--h) var(--s) var(--l));
 --ac-h:hsl(var(--h) var(--s) calc(var(--l) - 8%));
 --act:hsl(var(--h) var(--s) 28%);
 --acs:hsl(var(--h) 90% 94%);
 --sb1:hsl(var(--h) var(--s) 34%);
 --sb2:hsl(var(--h) var(--s) 18%);
 --sb3:hsl(calc(var(--h) - 12) var(--s) calc(var(--l) - 4%));
 --sbt:hsl(var(--h) 90% 88%);
 --bg:hsl(var(--h) 45% 97%);
 --bg2:hsl(var(--h) 60% 95%);
 --line:hsl(var(--h) 25% 89%);
 --text:hsl(var(--h) 35% 11%);
 --muted:hsl(var(--h) 12% 38%);
 --card:#fff;
 --ok:#15803d;--okb:#dcfce7;--warn:#a16207;--warnb:#fef3c7;--err:#b91c1c;--errb:#fee2e2;
 --blu:#185FA5;--ros:#E24B4A;
}
:root.dark{--bg:hsl(var(--h) 25% 10%);--bg2:hsl(var(--h) 25% 7%);--line:hsl(var(--h) 18% 22%);--text:hsl(var(--h) 20% 92%);--muted:hsl(var(--h) 12% 68%);--card:hsl(var(--h) 22% 14%);--acs:hsl(var(--h) 40% 22%);--act:hsl(var(--h) 90% 82%);--okb:#14301f;--ok:#4ade80;--warnb:#3a2f0a;--warn:#fcd34d;--errb:#3b1414;--err:#fca5a5}
.app{position:relative;height:100%;display:flex;font-size:14px;color:var(--text);background:var(--bg)}
.main{flex:1;min-width:0;overflow:auto;padding:26px 28px;position:relative;z-index:1}
.head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.head h2{font-size:22px;font-weight:650}
.head p{color:var(--muted);font-size:13px;margin-top:2px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;padding:0 12px;height:38px;border:1px solid var(--line);background:var(--card);border-radius:var(--r,10px);color:var(--muted)}
.search input{border:0;height:auto;padding:0;background:none;font:inherit;width:100%;min-width:0;color:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r,12px);padding:16px;margin-bottom:14px}
.kpis .card{margin-bottom:0}
.kpis .card span{color:var(--muted);font-size:12px}
.kpis .card b{display:block;font-size:26px;margin-top:4px}
.kpis .card em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.grid2>.card{margin-bottom:0}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.card h4{font-size:13px;margin-bottom:12px}
.logo{width:36px;height:36px;display:grid;place-items:center;background:var(--ac);color:#fff;font-weight:700;border-radius:10px;flex:none}
/* componenti */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r,10px);background:var(--ac);color:#fff;font-weight:600;font-size:13.5px;border:1px solid transparent;transition:background .15s;text-align:center}
.btn:hover{background:var(--ac-h)}
.btn.sec{background:var(--card);color:var(--act);border-color:var(--line)}
.btn.sec:hover{background:var(--acs)}
.btn.danger{background:var(--err)}
.btn.sm{min-height:36px;padding:0 12px;font-size:12.5px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:var(--r,10px);padding:0 12px;height:44px;min-width:0}
textarea{height:auto;padding:10px 12px}
input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.tbl td{padding:11px 8px;border-bottom:1px solid var(--line)}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--bg)}
.tbl .n{text-align:right;white-space:nowrap}
.tbl td.det{background:var(--bg);color:var(--muted);font-size:12.5px;line-height:1.6}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--acs);color:var(--act);margin:2px 4px 2px 0;white-space:nowrap}
.badge.ok{background:var(--okb);color:var(--ok)}
.badge.warn{background:var(--warnb);color:var(--warn)}
.badge.err{background:var(--errb);color:var(--err)}
.formrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.formrow .field{flex:1;min-width:140px}
.pal{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw:hover{box-shadow:0 0 0 2px var(--ac)}
input[type=range]{padding:0;border:0;height:auto;accent-color:var(--ac)}
/* sezioni e liste */
.seg{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.seg button{padding:0 14px;min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--text)}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-width:48px;min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--card);border-radius:var(--r,10px);text-align:center;font-size:15px}
.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row em{font-style:normal;color:var(--muted);font-size:12.5px}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--err);font-size:13px;margin:8px 0}
.okmsg{color:var(--ok);font-size:13px;margin:8px 0}
.stack>*+*{margin-top:12px}
.team{border:2px solid var(--line);border-radius:var(--r,12px);padding:12px;margin-bottom:12px;background:var(--card)}
.team.A{border-color:var(--blu)}.team.B{border-color:var(--ros)}
.team h4{margin-bottom:8px}
.team.A h4{color:var(--blu)}.team.B h4{color:var(--ros)}
.team input{width:100%;margin-bottom:8px}
.team input:last-child{margin-bottom:0}
.sideA{color:var(--blu)}.sideB{color:var(--ros)}
.mc{padding:12px 14px;margin-bottom:10px;cursor:pointer}
.mc .d{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.mc .t{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:2px 0}
.mc .t b{font-size:18px}
.mc .t.win{font-weight:700}
.mc.del{opacity:.55}
.mc .ex{display:none;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.mc.open .ex{display:flex}
.bar{height:5px;border-radius:3px;background:var(--acs);margin-top:5px}.bar i{display:block;height:5px;border-radius:3px;background:var(--ac)}
.podio{display:flex;gap:10px;align-items:flex-end;margin:6px 0 12px}
.podio>div{flex:1;text-align:center;background:var(--acs);border-radius:10px;padding:10px 6px;font-size:13px}
.podio>div b{display:block;font-size:20px}
.podio .p1{padding-top:22px}.podio .p3{padding-top:6px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.legend button{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;background:var(--card)}
.legend button.off{opacity:.4}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chart text{fill:var(--muted);font-size:11px}
.chart line.g{stroke:var(--line)}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px}
.chk input{width:22px;height:22px;accent-color:var(--ac)}
/* sidebar L4 */
.L4{--r:14px;background:var(--bg2)}
.L4 .sb{width:244px;flex:none;background:linear-gradient(180deg,var(--sb1),var(--sb2));color:var(--sbt);padding:18px 0 16px 14px;display:flex;flex-direction:column;transition:width .25s;overflow:hidden}
.L4.mini .sb{width:78px}
.L4 .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;white-space:nowrap;font-weight:650;color:#fff}
.L4 .logo{background:#fff;color:var(--act)}
.L4 .nav{flex:1;display:flex;flex-direction:column;gap:4px;overflow-y:auto;overflow-x:hidden}
.L4 .nav>li.bottom{margin-top:auto}
.L4 button.mi{display:flex;align-items:center;gap:14px;width:100%;height:46px;padding:0 16px;border-radius:14px 0 0 14px;color:var(--sbt);white-space:nowrap;position:relative}
.L4 button.mi:hover{background:rgba(255,255,255,.1);color:#fff}
.L4 button.mi.on{background:var(--bg2);color:var(--act);font-weight:600}
.L4 button.mi.on::before,.L4 button.mi.on::after{content:"";position:absolute;right:0;width:14px;height:14px;pointer-events:none}
.L4 button.mi.on::before{top:-14px;background:radial-gradient(circle at 0 0,transparent 14px,var(--bg2) 14.5px)}
.L4 button.mi.on::after{bottom:-14px;background:radial-gradient(circle at 0 100%,transparent 14px,var(--bg2) 14.5px)}
.L4 .chev{margin-left:auto;transition:transform .2s;opacity:.6;display:flex}
.L4 .nav>li.open .chev{transform:rotate(90deg)}
.L4 .subs{display:none;padding:2px 0 6px 50px}
.L4 .nav>li.open .subs{display:block}
.L4 .sl{display:block;width:100%;padding:8px 10px;font-size:13px;color:var(--sbt);border-radius:8px}
.L4 .sl:hover{color:#fff;background:rgba(255,255,255,.08)}
.L4 .sl.on{color:#fff;font-weight:600}
.L4.mini button.mi{padding:0 22px}
.L4.mini .lbl,.L4.mini .brand b{display:none}
.L4.mini .subs{display:none!important}
.bnav{display:none}
@media(max-width:599px){
 .L4 .sb{display:none}
 .main{padding:16px 14px calc(84px + env(safe-area-inset-bottom))}
 .head h2{font-size:19px}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
 .bnav button{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);text-align:center}
 .bnav button.on{color:var(--ac);font-weight:600}
 .tbl th,.tbl td{padding:10px 4px}
 .tbl{font-size:12.5px}
}
.app.lock .sb,.app.lock .bnav{pointer-events:none}
/* chip stato */
.chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--warnb);color:var(--warn)}
.chip.ro{background:var(--acs);color:var(--act)}
/* login */
#login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#eaf1fb,#d4e4f7)}
#login .box{width:100%;max-width:340px;text-align:center;background:#fff;border-radius:16px;padding:28px 22px;box-shadow:0 10px 40px rgba(24,95,165,.18);color:#14212E}
#login img{width:72px;height:72px;border-radius:18px;margin-bottom:10px}
#login h1{font-size:24px;margin-bottom:4px;color:#185FA5}
#login p{color:#6B7A8A;font-size:13px;margin-bottom:16px}
#login input{width:100%;text-align:center;font-size:24px;letter-spacing:8px;margin-bottom:8px;background:#fff;color:#14212E;border:1px solid #DCE4EC}
#login input#nome{font-size:18px;letter-spacing:0}
#login .btn{width:100%;margin-top:8px;background:#185FA5}
#login .btn.sec{background:#fff;color:#185FA5;border-color:#DCE4EC}
/* toast e modali */
#toasts{position:fixed;top:12px;right:12px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 24px)}
.toast{background:#14212E;color:#fff;padding:12px 16px;border-radius:12px;font-size:13.5px;box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center}
.toast.err{background:#b91c1c}
.toast button{color:#fff;text-decoration:underline;font-weight:600}
#modal{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px}
#modal .box{background:var(--card);color:var(--text);border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
#modal .box h3{font-size:17px;margin-bottom:12px}
#modal .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
#modal .acts .btn{flex:1}
#modal .big{font-size:48px;font-weight:700;text-align:center;margin:8px 0}
/* tabellone */
#match{position:fixed;inset:0;background:#111;z-index:100;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
#mbar{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:8px 12px;font-size:14px;gap:8px}
#mbar button{background:#333;color:#fff;border-radius:10px;padding:0 16px;min-height:44px;font-size:14px;text-align:center}
#minfo{text-align:center;flex:1}
#minfo b{font-size:20px}
#msq{flex:1;display:flex;flex-direction:column;gap:8px;padding:0 8px 8px;min-height:0}
@media (orientation:landscape){#msq{flex-direction:row}}
.q{flex:1;border:none;border-radius:20px;color:#fff;position:relative;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;min-height:0;min-width:0;text-align:center}
.q:active{filter:brightness(.92)}
.q.A{background:var(--blu)}.q.B{background:var(--ros)}
.q .n{font-size:min(38vh,48vw);font-weight:700;line-height:1}
.q .nm{position:absolute;top:12px;left:12px;right:12px;font-size:16px;opacity:.95}
.q .mn{position:absolute;bottom:12px;right:12px;width:56px;height:44px;border-radius:12px;background:rgba(255,255,255,.25);font-size:16px;display:flex;align-items:center;justify-content:center}
.gg{background:#FFF3CD;color:#7A5B00;border-radius:8px;padding:2px 10px;font-size:13px;font-weight:700}
#merr{color:#fecaca;text-align:center;font-size:13px;min-height:0;padding:0 8px}
body:not(.c-partite) [data-n=partite],body:not(.c-storico) [data-n=storico],body:not(.c-giocatori) [data-n=giocatori],body:not(.c-utenti) [data-n=utenti],body:not(.c-login) [data-n=login]{display:none!important}
#print{display:none}
#upd{display:none}
@media print{
 body>*:not(#print){display:none!important}
 #print{display:block!important;color:#000;background:#fff;padding:16px;font-size:12px}
 #print h2{margin:14px 0 6px;font-size:15px}
 #print table{width:100%;border-collapse:collapse;margin-bottom:8px}
 #print th,#print td{border-bottom:1px solid #999;padding:4px 6px;text-align:left}
}
</style>
</head>
<body>
<div id="stage"></div>
<div id="login" style="display:none"><div class="box">
 <img src="icons/icon.svg" alt="">
 <h1>Fusball</h1><p>Entra con il tuo nome e il tuo PIN</p>
 <input id="nome" type="text" autocomplete="username" placeholder="Nome e cognome" aria-label="Nome e cognome">
 <input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="PIN">
 <div class="err" id="pinerr" style="display:none"></div>
 <button class="btn" id="pinok">Entra</button>
 <button class="btn sec" id="guest">Entra come ospite (sola lettura)</button>
</div></div>
<div id="match"><div id="mbar"><button id="mx">Esci</button><div id="minfo"></div><button id="mend">Termina</button></div><div id="merr"></div><div id="msq"></div></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toasts"></div>
<div id="print"></div>
<datalist id="pl"></datalist>

<script src="config.js"></script>
<script>
"use strict";
const APP_VERSION="2.0",APP_DATE="25/11/2026";
const CFG=window.FUSBALL;
const BLU="#185FA5",ROS="#E24B4A";

/* ===================== utilità ===================== */
const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in(attrs||{})){const v=attrs[k];if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="value")e.value=v;else e.setAttribute(k,v===true?"":v)}
 (function add(list){for(const c of list){if(c==null||c===false)continue;if(Array.isArray(c))add(c);else e.appendChild(c.nodeType?c:document.createTextNode(String(c)))}})(kids);return e}
const clear=e=>{while(e.firstChild)e.removeChild(e.firstChild)};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const uuid=()=>crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:(r&3|8)).toString(16)});
const pk=(n,c)=>(String(n)+" "+String(c)).trim().replace(/\s+/g," ").toLowerCase();
const pad=n=>(n<10?"0":"")+n;
const fmtD=t=>new Intl.DateTimeFormat("it-IT",{timeZone:"Europe/Rome",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(new Date(t));
const fmtDay=t=>new Intl.DateTimeFormat("it-IT",{timeZone:"Europe/Rome",day:"2-digit",month:"2-digit",year:"numeric"}).format(new Date(t));
const ymRome=t=>new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Rome",year:"numeric",month:"2-digit"}).format(new Date(t)).slice(0,7);
const ymLabel=ym=>{const [y,m]=ym.split("-");return new Date(+y,+m-1,1).toLocaleDateString("it-IT",{month:"long",year:"numeric"})};
const mmss=s=>Math.floor(s/60)+":"+pad(s%60);
const pctOf=o=>o.g?Math.round(o.v/o.g*100):0;
const rule=m=>m.timer?"Timer "+(m.timer/60)+" min":"Obiettivo "+m.obj+", scarto "+m.scarto;
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ===================== icone (statiche) ===================== */
const I={
 home:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',

let _db;
function db(){return _db||(_db=new Promise((res,rej)=>{const r=indexedDB.open("fusball",1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("snapshot");d.createObjectStore("coda",{autoIncrement:true});d.createObjectStore("log",{autoIncrement:true})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function idb(store,mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(store,mode),s=t.objectStore(store);let out;const q=fn(s);if(q)q.onsuccess=()=>{out=q.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)})}
async function idbAllKV(store){const d=await db();return new Promise((res,rej)=>{const out=[];const r=d.transaction(store).objectStore(store).openCursor();r.onsuccess=()=>{const c=r.result;if(c){out.push({k:c.key,v:c.value});c.continue()}else res(out)};r.onerror=()=>rej(r.error)})}

async function apiErr(r){let j;try{j=await r.json()}catch(e){}const e=new Error((j&&j.message)||("HTTP "+r.status));e.code=(j&&j.message)||"";e.status=r.status;return e}
async function rpc(name,body){
 let r;try{r=await fetch(BASE+"rpc/"+name,{method:"POST",headers:{...baseHeaders(),"Content-Type":"application/json","Content-Profile":CFG.SCHEMA},body:JSON.stringify(body)})}catch(x){const e=new Error("offline");e.net=true;throw e}

async function enqueue(op){op.t=Date.now();await idb("coda","readwrite",s=>s.add(op));await loadQueue();rebuild();updateStatus();sync()}
async function runOp(op){
 const tk=S.token;
 if(op.tipo==="salva")return rpc("salva_partita",{p_token:tk,p:op.payload});
 if(op.tipo==="giocatore")return rpc("upsert_giocatore",{p_token:tk,p_nome:op.nome,p_cognome:op.cognome,p_soprannome:op.sopr||null});
 if(op.tipo==="modifica"||op.tipo==="annulla"){
  const r=await fetchAll("partite?select=id&client_id=eq."+encodeURIComponent(op.cid));if(!r.length)throw Object.assign(new Error("partita non trovata"),{code:"mancante"});
  return op.tipo==="modifica"?rpc("modifica_partita",{p_token:tk,p_id:r[0].id,p_gol_a:op.ga,p_gol_b:op.gb}):rpc("annulla_partita",{p_token:tk,p_id:r[0].id,p_annulla:op.v})}
 if(op.tipo==="modgioc"){const gs=await fetchAll("giocatori?select=id,nome,cognome");const g=gs.find(x=>pk(x.nome,x.cognome)===op.key);if(!g)throw Object.assign(new Error("giocatore non trovato"),{code:"mancante"});return rpc("modifica_giocatore",{p_token:tk,p_id:g.id,p_nome:op.nome,p_cognome:op.cognome,p_soprannome:op.sopr||null})}
 if(op.tipo==="attivo"){const gs=await fetchAll("giocatori?select=id,nome,cognome");const g=gs.find(x=>pk(x.nome,x.cognome)===op.key);if(!g)throw Object.assign(new Error("giocatore non trovato"),{code:"mancante"});return rpc("imposta_giocatore_attivo",{p_token:tk,p_id:g.id,p_attivo:op.v})}
}
async function sync(manual){
 if(S.syncing)return;if(!S.token){if(manual)toast("Entra con il PIN per sincronizzare","err");return}
 S.syncing=true;updateStatus();let done=0;
 try{
  const q=await idbAllKV("coda");
  for(const it of q){
   try{await runOp(it.v);await idb("coda","readwrite",s=>s.delete(it.k));done++;
    if(it.v.tipo==="salva")logEv("partita","partita salvata "+it.v.payload.gol_a+"-"+it.v.payload.gol_b)}
   catch(e){
    if(e.net)break;
    if(e.code==="non_autorizzato"){S.token=null;LS.del("fusball_token");logEv("accesso","sessione scaduta");S.profilo=null;LS.del("fusball_profilo");showLogin("Sessione scaduta, rientra con nome e PIN. Le partite in coda sono al sicuro.");break}
    logEv("errore","sync "+it.v.tipo+": "+e.message);await idb("coda","readwrite",s=>s.delete(it.k));toast("Operazione rifiutata: "+errMsg(e),"err")}}
  await refresh();LS.set("fusball_lastsync",Date.now());
 }finally{S.syncing=false;updateStatus();if((S.token||S.ro)&&S.route.m!=="nuova")render(true)}
 if(manual)toast(done?"Sincronizzate "+done+" operazioni":"Niente da sincronizzare")}

/* ===================== calcoli: statistiche, ELO, badge ===================== */
function inPer(m,p){if(p==="mese")return ymRome(m.t)===ymRome(Date.now());if(p==="30")return m.t>=Date.now()-30*864e5;return true}
const pairKey=(a)=>a.slice().sort().join(" + ");
function stats(ms){
 const P={},C={};
 const g=(M,k)=>M[k]||(M[k]={g:0,v:0,p:0,cur:0,best:0,gf:0,gs:0});
 ms.forEach(m=>{const aw=m.ga>m.gb;
  [[m.A,aw,m.ga,m.gb],[m.B,!aw,m.gb,m.ga]].forEach(([t,w,f,s])=>{
   const up=o=>{o.g++;o.gf+=f;o.gs+=s;if(w){o.v++;o.cur++;if(o.cur>o.best)o.best=o.cur}else{o.p++;o.cur=0}};
   t.forEach(k=>up(g(P,k)));up(g(C,pairKey(t)))})});
 return{P,C}}
function calcElo(ms){const r={},hist={};const get=k=>r[k]==null?(r[k]=CFG.ELO_START):r[k];
 ms.forEach((m,i)=>{const ra=(get(m.A[0])+get(m.A[1]))/2,rb=(get(m.B[0])+get(m.B[1]))/2;
  const ea=1/(1+Math.pow(10,(rb-ra)/400)),esito=m.ga>m.gb?1:m.ga<m.gb?0:.5,d=CFG.ELO_K*(esito-ea);
  m.A.forEach(k=>{r[k]+=d;(hist[k]=hist[k]||[]).push({i,t:m.t,r:r[k]})});
  m.B.forEach(k=>{r[k]-=d;(hist[k]=hist[k]||[]).push({i,t:m.t,r:r[k]})})});
 return{r,hist}}
const eloOf=(E,k)=>E.r[k]==null?CFG.ELO_START:E.r[k];
const BADGES=[["fiamme","In fiamme","Serie di vittorie ≥ "+CFG.BADGE.IN_FIAMME],["inarr","Inarrestabile","Serie di vittorie ≥ "+CFG.BADGE.INARRESTABILE],["vet","Veterano",CFG.BADGE.VETERANO+" partite"],["cent","Centurione",CFG.BADGE.CENTURIONE+" partite"],["capp","Cappotto","Vittoria con avversari a 0"],["dom","Dominio","Vittoria con scarto ≥ "+CFG.BADGE.DOMINIO_SCARTO],["rim","Rimonta","Vittoria dopo essere stati sotto di "+CFG.BADGE.RIMONTA_SOTTO],["muro","Muro",CFG.BADGE.MURO_MIN_PARTITE+" partite con media subiti ≤ "+CFG.BADGE.MURO_MEDIA_SUBITI]];
function rimonta(m,sq){if(!m.seq)return false;const mine=sq==="A"?"A":"B";let d=0,min=0;for(const c of m.seq){d+=c===mine?1:-1;if(d<min)min=d}return min<=-CFG.BADGE.RIMONTA_SOTTO}
function calcBadges(ms,P){const B={};const add=(k,b)=>{(B[k]=B[k]||new Set()).add(b)};
 Object.keys(P).forEach(k=>{const o=P[k];if(o.best>=CFG.BADGE.IN_FIAMME)add(k,"fiamme");if(o.best>=CFG.BADGE.INARRESTABILE)add(k,"inarr");if(o.g>=CFG.BADGE.VETERANO)add(k,"vet");if(o.g>=CFG.BADGE.CENTURIONE)add(k,"cent");if(o.g>=CFG.BADGE.MURO_MIN_PARTITE&&o.gs/o.g<=CFG.BADGE.MURO_MEDIA_SUBITI)add(k,"muro")});
 ms.forEach(m=>{[["A",m.A,m.ga,m.gb],["B",m.B,m.gb,m.ga]].forEach(([sq,t,f,s])=>{if(f>s){t.forEach(k=>{if(s===0)add(k,"capp");if(f-s>=CFG.BADGE.DOMINIO_SCARTO)add(k,"dom");if(rimonta(m,sq))add(k,"rim")})}})});
 return B}
function bestWorstMate(k,C){const l=Object.keys(C).filter(z=>z.split(" + ").includes(k)&&C[z].g>=CFG.MIN_COPPIA_PARTITE).sort((a,b)=>pctOf(C[b])-pctOf(C[a])||C[b].g-C[a].g);
 const mate=z=>z.split(" + ").find(x=>x!==k);return l.length?{best:mate(l[0]),bp:pctOf(C[l[0]]),worst:l.length>1?mate(l[l.length-1]):null,wp:l.length>1?pctOf(C[l[l.length-1]]):0}:null}

async function doLogin(){

 try{const r=await rpc("login",{p_nome:nome,p_pin:pin});
  if(!r){e.textContent="Nome o PIN errato";e.style.display="block";logEv("accesso","accesso fallito: "+nome);return}
  S.token=r.token;S.profilo={nome:r.nome,gruppo:r.gruppo,permessi:r.permessi};LS.set("fusball_token",S.token);LS.set("fusball_profilo",S.profilo);LS.set("fusball_nome",r.nome);S.ro=false;LS.del("fusball_ro");logEv("accesso","accesso di "+r.nome+" ("+r.gruppo+")");hideLogin();enter();sync()}
