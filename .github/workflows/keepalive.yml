name: keepalive
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Accept-Profile: fusball" "$URL/rest/v1/giocatori?select=id&limit=1")
          echo "HTTP $code"
          test "$code" = "200"
